name: CI
on:
  workflow_call:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
jobs:
  lint:
    name: Lint
    runs-on: macos-26
    timeout-minutes: 20
    permissions: {}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Verify Swift package tools version
        run: |
          xcodebuild -version
          xcrun swift --version
          test "$(swift package tools-version)" = "6.2.0"
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          version: 2026.5.5
          cache: true
      - name: SwiftFormat check
        run: mise exec -- swiftformat --lint .
      - name: SwiftLint check
        run: mise exec -- swiftlint lint --quiet
      - name: GitHub Actions syntax lint
        run: mise exec -- actionlint
      - name: GitHub Actions security lint
        run: mise exec -- zizmor --offline .
      - name: GitHub Actions policy lint
        run: mise exec -- ghalint run
      - name: GitHub Actions pin check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise exec -- pinact run --check
  test:
    name: Test (${{ matrix.macos-version }})
    runs-on: ${{ matrix.macos-version }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        macos-version:
          - macos-15
          - macos-26
    permissions: {}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Verify Swift package tools version
        run: |
          xcodebuild -version
          xcrun swift --version
          test "$(swift package tools-version)" = "6.2.0"
      - name: Build
        run: swift build
      - name: Unit and integration tests
        run: |
          PBM_BIN="$(swift build --show-bin-path)/pbm" swift test
      - name: CLI E2E smoke test
        run: scripts/e2e-smoke.sh
