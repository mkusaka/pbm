name: CI

on:
  workflow_call:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  lint:
    name: Lint
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify Swift 6.2 toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
          xcrun swift --version | grep -q 'Apple Swift version 6\.2\.'

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: 2026.5.5
          cache: true

      - name: SwiftFormat check
        run: mise exec -- swiftformat --lint .

      - name: SwiftLint check
        run: mise exec -- swiftlint lint --quiet

      - name: GitHub Actions syntax lint
        run: mise exec -- actionlint

      - name: GitHub Actions security lint
        run: mise exec -- zizmor --offline .

      - name: GitHub Actions policy lint
        run: mise exec -- ghalint run

      - name: GitHub Actions pin check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise exec -- pinact run --check

  test:
    name: Test (${{ matrix.macos-version }})
    runs-on: ${{ matrix.macos-version }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        macos-version:
          - macos-15
          - macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify Swift 6.2 toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
          xcrun swift --version | grep -q 'Apple Swift version 6\.2\.'

      - name: Build
        run: swift build

      - name: Unit and integration tests
        run: |
          PBW_BIN="$(swift build --show-bin-path)/pbw" swift test

      - name: CLI E2E smoke test
        run: scripts/e2e-smoke.sh
