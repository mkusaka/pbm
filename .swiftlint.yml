excluded:
  - .build
  - DerivedData
  - scripts

# Conflict resolution with SwiftFormat defaults.
# - trailing_comma: SwiftFormat keeps trailing commas in multiline literals and argument lists.
# - opening_brace: SwiftFormat places braces on the next line for multiline if/guard conditions.
disabled_rules:
  - trailing_comma
  - opening_brace
  - cyclomatic_complexity
  - file_length
  - force_cast
  - force_try
  - function_body_length
  - function_parameter_count
  - line_length
  - optional_data_string_conversion
  - type_body_length

opt_in_rules:
  - empty_count
  - empty_string
  - closure_spacing
  - contains_over_first_not_nil
  - overridden_super_call
  - redundant_nil_coalescing
  - sorted_imports
  - toggle_bool
  - first_where
  - last_where
  - direct_return
  - shorthand_optional_binding
  - private_swiftui_state

identifier_name:
  min_length:
    warning: 1
  excluded:
    - id

reporter: xcode
